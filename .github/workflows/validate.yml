name: validate

# Required check for PRs: the pack must satisfy Orca's loader rules plus
# placeholder/glossary checks. A structural loader break rejects the pack.
# A protected path rejects the pack through v1.4.244; from v1.4.245 the runtime
# skips that path and leaves English, and strict validation still fails.
# Validates against the upstream commit pinned in .sync/lock.json, so the
# result does not change just because upstream moved.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/sync.py validate --warnings
        env:
          GH_TOKEN: ${{ github.token }}
