name: validate

# Required check for PRs: the pack must satisfy Orca's loader rules (a single
# violation makes Orca reject the whole pack) plus placeholder/glossary checks.
# Validates against the upstream commit pinned in .sync/lock.json, so the
# result does not change just because upstream moved.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/sync.py validate --warnings
        env:
          GH_TOKEN: ${{ github.token }}
